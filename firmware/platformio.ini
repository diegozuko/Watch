; Compilar y flashear con PlatformIO:
;   pio run -e esp32c3 -t upload       (ESP32-C3, p. ej. "SuperMini")
;   pio run -e esp32s3 -t upload       (ESP32-S3)
;   pio run -e esp32 -t upload         (ESP32 clásico / DevKit)
;   pio device monitor                 (ver logs)

[platformio]
src_dir = CrownScroll
default_envs = esp32c3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@~2.5.2

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
board = esp32dev
